---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: propose-graph-update
spec:
  description: >-
    Opens a PR against the OKD cincinnati-graph-data repository adding an accepted release
    to every channel whose feeder matches the release stream, mirroring the
    "Enable X in candidate channel" PRs ART opens for OCP.
  params:
    - description: The name of the accepted release (e.g., 5.0.0-okd-scos.2)
      name: release-name
      type: string
    - description: The release stream the release was promoted to (e.g., 5-scos-stable, 5-scos-next)
      name: release-stream
      type: string
    - description: The release controller, used to link the release in the PR body
      name: release-controller
      type: string
      default: "https://amd64.origin.releases.ci.openshift.org"
    - description: The GitHub org/repo of the graph data to open the PR against
      name: graph-data-repo
      type: string
      default: "okd-project/cincinnati-graph-data"
    - description: The branch of the graph data repository to target
      name: graph-data-base-branch
      type: string
      default: "main"
    - description: This is the token generated by the GitHub App using the task get-github-access-token
      name: token
      type: string
    - description: The slug of the GitHub App the token belongs to, used as the commit author
      name: github-app-slug
      type: string
      default: "okd-tekton-token"
    - description: Only print the proposed channel changes, without pushing or opening a PR
      name: dry-run
      type: string
      default: "false"
  steps:
    - image: "quay.io/okd/tekton-worker:latest"
      name: "propose-graph-update"
      env:
        - name: HOME
          value: /tekton/home
        - name: GH_TOKEN
          value: $(params.token)
        - name: GITHUB_APP_SLUG
          value: $(params.github-app-slug)
        - name: RELEASE_NAME
          value: $(params.release-name)
        - name: RELEASE_STREAM
          value: $(params.release-stream)
        - name: RELEASE_CONTROLLER
          value: $(params.release-controller)
        - name: GRAPH_DATA_REPO
          value: $(params.graph-data-repo)
        - name: GRAPH_DATA_BASE_BRANCH
          value: $(params.graph-data-base-branch)
        - name: DRY_RUN
          value: $(params.dry-run)
        - name: PIPELINE_RUN
          value: $(context.pipelineRun.name)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # OKD channel feeders are named after the release-controller stream that fills them.
        case "$RELEASE_STREAM" in
          *-scos-stable) FEEDER=stable ;;
          *-scos-next) FEEDER=candidate ;;
          *) echo "[ERROR] No channel feeder is known for release stream ${RELEASE_STREAM}" >&2; exit 1 ;;
        esac
        if [[ ! "$RELEASE_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+-okd-scos\.(ec\.)?[0-9]+$ ]]; then
          echo "[ERROR] ${RELEASE_NAME} is not an OKD/SCOS release name" >&2
          exit 1
        fi
        # get-github-access-token writes "null" when GitHub refuses to issue a token.
        if [[ "$DRY_RUN" != "true" && ( -z "${GH_TOKEN:-}" || "$GH_TOKEN" == "null" ) ]]; then
          echo "[ERROR] No GitHub App token; check get-github-access-token, or set dry-run=true" >&2
          exit 1
        fi

        # Add the release to a channel's versions list, keeping the file's indentation and
        # ordering engineering candidates before GA builds of the same version.
        insert_version() {
          awk -v rel="$RELEASE_NAME" '
            function key(v,  a, ec) {
              if (v !~ /^[0-9]+\.[0-9]+\.[0-9]+-okd-scos\.(ec\.)?[0-9]+$/) return ""
              ec = (v ~ /-okd-scos\.ec\./) ? 0 : 1
              sub(/-okd-scos\.(ec\.)?/, ".", v)
              split(v, a, ".")
              return sprintf("%09d%09d%09d%d%09d", a[1], a[2], a[3], ec, a[4])
            }
            function add(indent) { print indent "- " rel; done = 1 }
            BEGIN { new = key(rel) }
            state == 0 && /^versions:[[:space:]]*\[[[:space:]]*\][[:space:]]*$/ {
              print "versions:"; add(""); state = 2; next
            }
            state == 0 && /^versions:[[:space:]]*$/ { print; state = 1; next }
            state == 1 && /^[[:space:]]*-[[:space:]]+[^[:space:]]+[[:space:]]*$/ {
              indent = $0; sub(/-.*/, "", indent)
              v = $0; sub(/^[[:space:]]*-[[:space:]]+/, "", v); sub(/[[:space:]]+$/, "", v)
              k = key(v)
              if (!done && k != "" && k > new) add(indent)
              printf "%s", blanks; blanks = ""
              print; next
            }
            # Hold blank lines so an appended version lands right after the last item.
            state == 1 && /^[[:space:]]*$/ { blanks = blanks $0 "\n"; next }
            state == 1 {
              if (!done) add(indent)
              printf "%s", blanks; blanks = ""
              state = 2
            }
            { print }
            END {
              if (state == 1 && !done) add(indent)
              printf "%s", blanks
              if (!done) exit 1
            }
          ' "$1"
        }

        WORKDIR="$(mktemp -d)"
        git clone --quiet --depth 1 --branch "$GRAPH_DATA_BASE_BRANCH" \
          "https://github.com/${GRAPH_DATA_REPO}.git" "$WORKDIR"
        cd "$WORKDIR"
        echo "[INFO] ${GRAPH_DATA_REPO}@${GRAPH_DATA_BASE_BRANCH} is at $(git rev-parse HEAD)"

        if [[ "$DRY_RUN" == "true" ]]; then
          GIT_NAME="okd-graph-update"
          GIT_EMAIL="okd-graph-update@localhost"
        else
          # Installation tokens cannot call /user, so look the app's bot account up by name;
          # GitHub attributes commits to it through the id-prefixed noreply address.
          GIT_NAME="${GITHUB_APP_SLUG}[bot]"
          BOT_ID="$(gh api "users/${GITHUB_APP_SLUG}%5Bbot%5D" --jq '.id')"
          GIT_EMAIL="${BOT_ID}+${GIT_NAME}@users.noreply.github.com"
        fi

        export R="$RELEASE_NAME"
        MATCHED=()
        CHANGED=()
        for FILE in channels/*.yaml; do
          CHANNEL="$(yq '.name' "$FILE")"
          [[ "$(yq '.feeder.name // ""' "$FILE")" == "$FEEDER" ]] || continue
          # Cincinnati fully matches feeder filters; OKD filters only use ERE-compatible syntax.
          FILTER="$(yq '.feeder.filter // ".*"' "$FILE")"
          [[ "$RELEASE_NAME" =~ ^(${FILTER})$ ]] || continue
          MATCHED+=("$CHANNEL")

          if [[ "$(yq '((.versions // []) + (.tombstones // [])) | any_c(. == strenv(R))' "$FILE")" == "true" ]]; then
            echo "[INFO] ${CHANNEL} already lists or tombstones ${RELEASE_NAME}"
            continue
          fi

          EXPECTED="$(yq -o=json -I=0 '(.versions // []) + [strenv(R)] | sort' "$FILE")"
          insert_version "$FILE" > "$FILE.new" || {
            echo "[ERROR] ${FILE} has no top-level versions list" >&2
            exit 1
          }
          mv "$FILE.new" "$FILE"
          if [[ "$(yq -o=json -I=0 '.versions | sort' "$FILE")" != "$EXPECTED" ]]; then
            echo "[ERROR] Failed to add ${RELEASE_NAME} to ${FILE} cleanly" >&2
            exit 1
          fi

          git diff -- "$FILE"
          git add -- "$FILE"
          git -c user.name="$GIT_NAME" -c user.email="$GIT_EMAIL" \
            commit --quiet -m "${FILE%.yaml}: Promote ${RELEASE_NAME}"
          CHANGED+=("$CHANNEL")
        done

        if (( ${#MATCHED[@]} == 0 )); then
          echo "[ERROR] No channel in ${GRAPH_DATA_REPO} has a '${FEEDER}' feeder whose filter matches" \
            "${RELEASE_NAME}; create the channel before proposing this release" >&2
          exit 1
        fi
        if (( ${#CHANGED[@]} == 0 )); then
          echo "[INFO] ${RELEASE_NAME} is already in every matching channel; nothing to do"
          exit 0
        fi
        if [[ "$DRY_RUN" == "true" ]]; then
          echo "[INFO] Dry run: not opening a PR"
          exit 0
        fi

        # A GitHub App has no account to fork into, so the branch goes to the graph-data repo itself.
        BRANCH="okd-release/${RELEASE_NAME}"

        EXISTING="$(gh api "repos/${GRAPH_DATA_REPO}/pulls?state=open&base=${GRAPH_DATA_BASE_BRANCH}&head=${GRAPH_DATA_REPO%%/*}:${BRANCH}" \
          --jq '.[0].html_url // empty')"
        if [[ -n "$EXISTING" ]]; then
          echo "[INFO] Existing PR: ${EXISTING}"
          exit 0
        fi

        # No open PR uses this branch, so it is safe to overwrite a leftover from an earlier run.
        # The credential helper reads the token from the environment so it never appears in output.
        git -c credential.helper='!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f' \
          push --quiet --force "https://github.com/${GRAPH_DATA_REPO}.git" "HEAD:refs/heads/${BRANCH}"

        RELEASE_URL="${RELEASE_CONTROLLER%/}/releasestream/${RELEASE_STREAM}/release/${RELEASE_NAME}"
        BODY="Enable [${RELEASE_NAME}](${RELEASE_URL}) in the following ${FEEDER} channels, now that it has been accepted in the \`${RELEASE_STREAM}\` release stream:"$'\n\n'
        for CHANNEL in "${CHANGED[@]}"; do
          BODY+="- \`${CHANNEL}\`"$'\n'
        done
        BODY+=$'\n'"Opened automatically by the \`${PIPELINE_RUN}\` PipelineRun."$'\n'

        PR_URL="$(gh api -X POST "repos/${GRAPH_DATA_REPO}/pulls" \
          -f title="Enable ${RELEASE_NAME} in ${FEEDER} channels" \
          -f head="$BRANCH" \
          -f base="$GRAPH_DATA_BASE_BRANCH" \
          -f body="$BODY" \
          --jq '.html_url')"
        echo "[INFO] Opened PR: ${PR_URL}"
