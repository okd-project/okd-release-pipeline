---
# okd-release-pipeline runs as the default OpenShift Pipelines "pipeline" service account;
# trigger-graph-update uses it to start okd-graph-update-pipeline.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: okd-graph-update-trigger
subjects:
  - kind: ServiceAccount
    name: pipeline
roleRef:
  kind: Role
  name: okd-graph-update-trigger
  apiGroup: rbac.authorization.k8s.io
